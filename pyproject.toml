[project]
name = "mcp_cube_server"
version = "0.1.1"
description = "MCP server for interfacing with Cube.dev REST API (Quinyx fork — bug fixes on top of isaacwasserman/mcp_cube_server 0.0.2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # <2: mcp 2.x renamed FastMCP to MCPServer and changed APIs. Unpinned, a
    # `pipx install --force` resolved to 2.x and the server failed on import
    # (2026-10-01). Migrate deliberately, not by accident.
    "mcp>=1.2.1,<2",
    "pandas",
    "pyjwt>=2.10.1",
    "python-dotenv",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389"]

[project.scripts]
mcp_cube_server = "mcp_cube_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cube_server"]
